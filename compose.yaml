services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: homepulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
      POSTGRES_DB: homepulse
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
