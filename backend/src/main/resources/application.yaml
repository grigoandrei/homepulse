spring:
  application:
    name: backend
  config:
    import: optional:file:../.env[.properties]

  datasource:
    url:  jdbc:postgresql://localhost:5433/homepulse
    username: homepulse
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

